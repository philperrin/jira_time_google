<script>
  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function setDensity(mode) {
    const container = document.getElementById('assignments-container');
    if (container) {
      container.classList.remove('density-comfortable', 'density-compact');
      container.classList.add('density-' + mode);
    }
    const comfortBtn = document.getElementById('density-comfortable-btn');
    const compactBtn = document.getElementById('density-compact-btn');
    if (comfortBtn && compactBtn) {
      if (mode === 'compact') {
        comfortBtn.className = 'btn btn-secondary';
        compactBtn.className = 'btn btn-primary';
      } else {
        comfortBtn.className = 'btn btn-primary';
        compactBtn.className = 'btn btn-secondary';
      }
    }
    localStorage.setItem('jtt-density', mode);
  }

  (function initDensity() {
    const saved = localStorage.getItem('jtt-density') || 'comfortable';
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => setDensity(saved));
    } else {
      setDensity(saved);
    }
  })();

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  function showStatus(elementId, message, type) {
    const el = document.getElementById(elementId);
    if (!el) return;
    el.textContent = message;
    el.className = 'status-msg ' + type;
  }

  function setLoading(btnId, loading, label) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.disabled = loading;
    btn.textContent = loading ? 'Loading…' : label;
  }

  // ── Config Tab ──────────────────────────────────────────────
  function loadConfig() {
    google.script.run
      .withSuccessHandler(cfg => {
        document.getElementById('cfg-jira-url').value = cfg.jiraUrl;
        document.getElementById('cfg-api-key-status').textContent = cfg.hasApiKey ? '✓ API key saved' : 'No API key saved';
      })
      .getConfig();
    google.script.run
      .withSuccessHandler(renderAllocationTable)
      .getAllocation();
  }

  function saveConfig() {
    const url = document.getElementById('cfg-jira-url').value.trim();
    const key = document.getElementById('cfg-api-key').value.trim();
    let pending = 0;
    function done() { if (--pending === 0) { setLoading('cfg-save-btn', false, 'Save'); showStatus('cfg-status', 'Saved!', 'success'); } }
    function fail(e) { setLoading('cfg-save-btn', false, 'Save'); showStatus('cfg-status', 'Error: ' + e.message, 'error'); }
    if (url) { pending++; google.script.run.withSuccessHandler(done).withFailureHandler(fail).saveJiraUrl(url); }
    if (key) { pending++; google.script.run.withSuccessHandler(done).withFailureHandler(fail).saveApiKey(key); }
    if (pending > 0) { setLoading('cfg-save-btn', true, 'Save'); }
    else { showStatus('cfg-status', 'Nothing to save.', 'info'); }
  }

  function renderAllocationTable(rows) {
    const tbody = document.getElementById('allocation-body');
    tbody.innerHTML = '';
    (rows || []).forEach(row => addAllocationRow(row));
  }

  function addAllocationRow(data) {
    const tbody = document.getElementById('allocation-body');
    const tr = document.createElement('tr');

    const COLOR_OPTIONS = [
      ['#828bc2', 'Lavender (#828bc2)'],
      ['#55b080', 'Sage (#55b080)'],
      ['#a75aba', 'Grape (#a75aba)'],
      ['#d6837a', 'Flamingo (#d6837a)'],
      ['#e7ba51', 'Banana (#e7ba51)'],
      ['#e3683e', 'Tangerine (#e3683e)'],
      ['#4b99d2', 'Peacock (#4b99d2)'],
      ['#7c7c7c', 'Graphite (#7c7c7c)'],
      ['#6e72c3', 'Blueberry (#6e72c3)'],
      ['#489160', 'Basil (#489160)'],
      ['#da5234', 'Tomato (#da5234)'],
    ];

    const selectedHex = (data && data.colorHex) || '';
    const optionsHtml = COLOR_OPTIONS.map(([val, label]) =>
      '<option value="' + val + '"' + (val === selectedHex ? ' selected' : '') + '>' + label + '</option>'
    ).join('');

    const ignored = data && data.ignore ? 'checked' : '';

    tr.innerHTML =
      '<td><select name="colorHex" style="width:100%">' + optionsHtml + '</select></td>' +
      '<td><input type="text" style="width:100%" name="projectKey" value="' + esc((data && data.projectKey) || '') + '" placeholder="CEOT"></td>' +
      '<td><input type="text" style="width:100%" name="projectName" value="' + esc((data && data.projectName) || '') + '" placeholder="CFA Project"></td>' +
      '<td><input type="text" style="width:100%" name="hoursPerWeek" value="' + esc(String((data && data.hoursPerWeek) || '')) + '" placeholder="20"></td>' +
      '<td style="text-align:center"><input type="checkbox" name="ignore" ' + ignored + '></td>' +
      '<td><button class="btn" style="padding:4px 8px;" onclick="this.closest(\'tr\').remove()">✕</button></td>';

    tbody.appendChild(tr);
  }

  function saveAllocationTable() {
    const rows = Array.from(document.querySelectorAll('#allocation-body tr')).map(tr => {
      const cells = tr.querySelectorAll('td');
      return {
        colorHex: cells[0].querySelector('select').value,
        projectKey: cells[1].querySelector('input').value.trim(),
        projectName: cells[2].querySelector('input').value.trim(),
        hoursPerWeek: parseFloat(cells[3].querySelector('input').value) || 0,
        ignore: cells[4].querySelector('input').checked
      };
    }).filter(r => r.projectKey);
    google.script.run
      .withSuccessHandler(() => showStatus('allocation-status', 'Allocation saved.', 'success'))
      .withFailureHandler(e => showStatus('allocation-status', 'Error: ' + e.message, 'error'))
      .saveAllocation(rows);
  }

  // Load config when tab is clicked
  document.querySelector('[data-tab="config"]').addEventListener('click', loadConfig);

  // ── Timecard Tab ─────────────────────────────────────────────
  (function initTimecardDates() {
    const today = new Date();
    const day = today.getDay();
    const monday = new Date(today);
    monday.setDate(today.getDate() - (day === 0 ? 6 : day - 1));
    const friday = new Date(monday);
    friday.setDate(monday.getDate() + 4);
    const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('tc-start-date').value = fmt(monday);
      document.getElementById('tc-end-date').value = fmt(friday);
    });
  })();

  window.timecardEvents = [];
  window.issueOptions = [];
  window.worklogRows = [];
  window.timecardAllocation = [];

  function loadTimecardEvents() {
    const start = document.getElementById('tc-start-date').value;
    const end = document.getElementById('tc-end-date').value;
    if (!start || !end) { showStatus('tc-status', 'Select a date range.', 'info'); return; }
    setLoading('tc-load-btn', true, 'Import Events');
    showStatus('tc-status', 'Importing calendar events…', 'info');

    // Load issues for dropdown in parallel
    google.script.run
      .withSuccessHandler(issues => { window.issueOptions = issues; })
      .withFailureHandler(e => showStatus('tc-status', 'Could not load issues for dropdowns: ' + e.message, 'error'))
      .getJiraIssues();

    // Load allocation (for the manual-entry Project dropdown) in parallel
    google.script.run
      .withSuccessHandler(rows => { window.timecardAllocation = rows; })
      .getAllocation();

    google.script.run
      .withSuccessHandler(events => {
        window.timecardEvents = events;
        renderTimecardTable(events);
        setLoading('tc-load-btn', false, 'Import Events');
        showStatus('tc-status', `${events.length} event(s) imported.`, 'success');
      })
      .withFailureHandler(e => {
        setLoading('tc-load-btn', false, 'Import Events');
        showStatus('tc-status', 'Error: ' + e.message, 'error');
      })
      .importCalendarEvents(start, end);
  }

  function renderTimecardTable(events) {
    const container = document.getElementById('tc-days-container');
    container.innerHTML = '';

    const dates = [...new Set(events.map(e => e.date))].sort();

    const fmtFull = dateStr => new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    const fmtShort = dateStr => new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', {
      month: 'short', day: 'numeric'
    });

    dates.forEach(date => {
      const dayEvents = events.filter(e => e.date === date);

      const heading = document.createElement('h3');
      heading.className = 'project-heading';
      heading.textContent = fmtFull(date);
      container.appendChild(heading);

          const table = document.createElement('table');
    table.style.tableLayout = 'fixed';
    table.dataset.date = date;
    table.innerHTML = `<thead><tr>
      <th style="width:13%">Event</th>
      <th style="width:24%">Description</th>
      <th style="width:8%">Start</th>
      <th style="width:8%">End</th>
      <th style="width:8%">Project</th>
      <th style="width:20%">Jira Issue</th>
      <th style="width:7%">Duration (h)</th>
      <th style="width:5%"></th>
    </tr></thead>`;
      const tbody = document.createElement('tbody');

      dayEvents.forEach(ev => {
        const idx = events.indexOf(ev);
        const desc = ev.description || '';
        const truncated = desc.length > 150 ? desc.slice(0, 150) + '…' : desc;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td title="${esc(ev.description)}">${esc(ev.title)}</td>
          <td>${esc(truncated)}</td>
          <td>${esc(ev.start)}</td>
          <td>${esc(ev.end)}</td>
          <td>${esc(ev.projectKey)}</td>
          <td>
            <select data-idx="${idx}" class="tc-issue-select" style="min-width:200px;">
              <option value="">— select —</option>
            </select>
          </td>
          <td>${esc(String(ev.duration))}</td>`;
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      container.appendChild(table);

      const addEntryBtn = document.createElement('button');
      addEntryBtn.className = 'btn btn-secondary';
      addEntryBtn.style.marginTop = '8px';
      addEntryBtn.textContent = '+ Add Entry';
      addEntryBtn.onclick = function() { addManualEntry(date); };
      container.appendChild(addEntryBtn);

      const dayTotal = document.createElement('div');
      dayTotal.className = 'tc-day-total';
      dayTotal.dataset.date = date;
      dayTotal.textContent = 'Day total: — (0 of ' + dayEvents.length + ' events assigned)';
      container.appendChild(dayTotal);
    });

    // Build summary table headers (static — built once)
    const shortHeaders = dates.map(fmtShort);
    document.getElementById('tc-summary-head').innerHTML =
      '<tr><th>Project</th>' +
      shortHeaders.map(h => `<th>${esc(h)}</th>`).join('') +
      '<th class="pivot-total">Total</th></tr>';

    container.style.display = '';
    document.getElementById('tc-summary').style.display = '';
    document.getElementById('tc-submit-toolbar').style.display = '';

    // Populate issue dropdowns once issues are loaded (poll briefly)
    let attempts = 0;
    const populate = setInterval(() => {
      if (window.issueOptions.length || ++attempts > 20) {
        clearInterval(populate);
        document.querySelectorAll('.tc-issue-select').forEach(sel => {
          const ev = window.timecardEvents[parseInt(sel.dataset.idx)];
          window.issueOptions.forEach(issue => {
            const opt = document.createElement('option');
            opt.value = issue.key;
            opt.textContent = issue.dropdownValue;
            if (issue.projectKey === ev.projectKey) sel.appendChild(opt);
          });
          sel.addEventListener('change', updateSummaryTable);
        });
        updateSummaryTable();
      }
    }, 300);
  }

  function to12Hour(hhmm) {
    const [hStr, mStr] = hhmm.split(':');
    let h = parseInt(hStr, 10);
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return String(h).padStart(2, '0') + ':' + mStr + ' ' + ampm;
  }

  function buildProjectOptionsHtml() {
    return (window.timecardAllocation || [])
      .filter(r => r.projectKey)
      .map(r => '<option value="' + esc(r.projectKey) + '">' + esc(r.projectName || r.projectKey) + '</option>')
      .join('');
  }

  function addManualEntry(date) {
    const idx = window.timecardEvents.length;
    const newEvent = { title: 'Manual entry', date: date, start: '', end: '', description: '', projectKey: '', issueKey: '', duration: 0 };
    window.timecardEvents.push(newEvent);

    const tbody = document.querySelector('table[data-date="' + date + '"] tbody');
    if (!tbody) return;

    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>Manual entry</td>' +
      '<td></td>' +
      '<td><input type="time" class="tc-manual-start" style="width:100%"></td>' +
      '<td><input type="time" class="tc-manual-end" style="width:100%"></td>' +
      '<td><select class="tc-manual-project" style="width:100%"><option value="">— select —</option>' + buildProjectOptionsHtml() + '</select></td>' +
      '<td><select data-idx="' + idx + '" class="tc-issue-select" style="min-width:200px;"><option value="">— select —</option></select></td>' +
      '<td class="tc-manual-duration">0.00</td>' +
      '<td><button class="btn" style="padding:4px 8px;" onclick="removeManualEntry(this, ' + idx + ')" title="Remove entry" aria-label="Remove entry">✕</button></td>';
    tbody.appendChild(tr);

    const startInput = tr.querySelector('.tc-manual-start');
    const endInput = tr.querySelector('.tc-manual-end');
    const projectSelect = tr.querySelector('.tc-manual-project');
    const issueSelect = tr.querySelector('.tc-issue-select');
    const durationCell = tr.querySelector('.tc-manual-duration');

    function recomputeDuration() {
      const start = startInput.value, end = endInput.value;
      let hours = 0;
      if (start && end) {
        const startDate = new Date('1970-01-01T' + start + ':00');
        const endDate = new Date('1970-01-01T' + end + ':00');
        hours = Math.max(0, (endDate - startDate) / 3600000);
      }
      newEvent.duration = hours;
      newEvent.start = start ? to12Hour(start) : '';
      newEvent.end = end ? to12Hour(end) : '';
      durationCell.textContent = hours.toFixed(2);
      updateSummaryTable();
    }
    startInput.addEventListener('change', recomputeDuration);
    endInput.addEventListener('change', recomputeDuration);

    projectSelect.addEventListener('change', () => {
      newEvent.projectKey = projectSelect.value;
      issueSelect.innerHTML = '<option value="">— select —</option>';
      (window.issueOptions || []).forEach(issue => {
        if (issue.projectKey === projectSelect.value) {
          const opt = document.createElement('option');
          opt.value = issue.key;
          opt.textContent = issue.dropdownValue;
          issueSelect.appendChild(opt);
        }
      });
      updateSummaryTable();
    });

    issueSelect.addEventListener('change', updateSummaryTable);
  }

  function removeManualEntry(btn, idx) {
    window.timecardEvents[idx] = null;
    const tr = btn.closest('tr');
    if (tr) tr.remove();
    updateSummaryTable();
  }

  function updateSummaryTable() {
    const allEvents = window.timecardEvents;
    if (!allEvents || !allEvents.length) return;
    const events = allEvents.filter(Boolean);
    if (!events.length) return;

    const dates = [...new Set(events.map(e => e.date))].sort();
    const projects = [...new Set(events.map(e => e.projectKey))].sort();

    // Build a map: { projectKey: { date: totalHours } }
    const sums = {};
    projects.forEach(p => { sums[p] = {}; dates.forEach(d => { sums[p][d] = 0; }); });

    document.querySelectorAll('.tc-issue-select').forEach(sel => {
      if (!sel.value) return;
      const ev = allEvents[parseInt(sel.dataset.idx)];
      if (!ev) return;
      sums[ev.projectKey][ev.date] = (sums[ev.projectKey][ev.date] || 0) + (ev.duration || 0);
    });

    const colTotals = {};
    dates.forEach(d => { colTotals[d] = 0; });

    document.getElementById('tc-summary-body').innerHTML = projects.map(p => {
      let rowTotal = 0;
      const cells = dates.map(d => {
        const v = sums[p][d] || 0;
        colTotals[d] += v;
        rowTotal += v;
        return `<td>${v > 0 ? v.toFixed(2) : '—'}</td>`;
      });
      return `<tr><td>${esc(p)}</td>${cells.join('')}<td class="pivot-total">${rowTotal > 0 ? rowTotal.toFixed(2) : '—'}</td></tr>`;
    }).join('');

    const grandTotal = dates.reduce((s, d) => s + colTotals[d], 0);
    document.getElementById('tc-summary-foot').innerHTML =
      '<tr class="pivot-total"><td>Total</td>' +
      dates.map(d => `<td>${colTotals[d] > 0 ? colTotals[d].toFixed(2) : '—'}</td>`).join('') +
      `<td class="pivot-total">${grandTotal > 0 ? grandTotal.toFixed(2) : '—'}</td></tr>`;

    dates.forEach(date => {
      const dayEvents = events.filter(e => e.date === date);
      let dayTotal = 0, assignedCount = 0;
      dayEvents.forEach(e => {
        const idx = allEvents.indexOf(e);
        const sel = document.querySelector('.tc-issue-select[data-idx="' + idx + '"]');
        if (sel && sel.value) { dayTotal += e.duration || 0; assignedCount++; }
      });
      const el = document.querySelector('.tc-day-total[data-date="' + date + '"]');
      if (el) el.textContent = 'Day total: ' + (dayTotal > 0 ? dayTotal.toFixed(2) + ' h' : '—') +
        ' (' + assignedCount + ' of ' + dayEvents.length + ' events assigned)';
    });
  }

  function submitTimecard() {
    const entries = Array.from(document.querySelectorAll('.tc-issue-select')).map(sel => {
      const ev = window.timecardEvents[parseInt(sel.dataset.idx)];
      return { date: ev.date, issueKey: sel.value, startTime: ev.start, durationHours: ev.duration };
    }).filter(e => e.issueKey && e.durationHours > 0);

    if (!entries.length) { showStatus('tc-submit-status', 'No issues selected.', 'info'); return; }
    setLoading('tc-submit-btn', true, '📥 Send to Jira');
    google.script.run
      .withSuccessHandler(result => {
        setLoading('tc-submit-btn', false, '📥 Send to Jira');
        document.querySelectorAll('.tc-issue-select').forEach(s => s.value = '');
        const msg = `Sent ${result.succeeded} worklog(s).` + (result.failed ? ` ${result.failed} failed: ${result.errors.join(', ')}` : '');
        showStatus('tc-submit-status', msg, result.failed ? 'error' : 'success');
      })
      .withFailureHandler(e => {
        setLoading('tc-submit-btn', false, '📥 Send to Jira');
        showStatus('tc-submit-status', 'Error: ' + e.message, 'error');
      })
      .sendTimeEntries(entries);
  }

  // ── Assignments Tab ──────────────────────────────────────────
  (function initScheduleDate() {
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('schedule-date').value = fmt(tomorrow);
    });
  })();

  window.loadedIssues = [];

  function loadAssignments() {
    setLoading('assignments-load-btn', true, 'Load Assignments');
    showStatus('assignments-status', 'Fetching from Jira…', 'info');
    let issues = null, allocationRows = null;
    function tryRender() {
      if (issues === null || allocationRows === null) return;
      window.loadedIssues = issues;
      const nameMap = Object.fromEntries(
        allocationRows.filter(r => r.projectKey && r.projectName).map(r => [r.projectKey, r.projectName])
      );
      renderAssignments(issues, nameMap);
      setLoading('assignments-load-btn', false, 'Load Assignments');
      document.getElementById('assignments-count').textContent = `${issues.length} issues`;
      showStatus('assignments-status', '', '');
    }
    google.script.run
      .withSuccessHandler(r => { issues = r; tryRender(); })
      .withFailureHandler(e => {
        setLoading('assignments-load-btn', false, 'Load Assignments');
        showStatus('assignments-status', 'Error: ' + e.message, 'error');
      })
      .getJiraIssues();
    google.script.run
      .withSuccessHandler(r => { allocationRows = r; tryRender(); })
      .getAllocation();
  }

  function toggleGroup(headingEl) {
    const group = headingEl.closest('.project-group');
    if (!group) return;
    const toggle = headingEl.querySelector('.group-toggle');
    if (group.classList.contains('collapsed')) {
      group.classList.remove('collapsed');
      if (toggle) toggle.textContent = '▼';
    } else {
      group.classList.add('collapsed');
      if (toggle) toggle.textContent = '▶';
    }
  }

  function setAllGroupsCollapsed(collapsed) {
    document.querySelectorAll('#assignments-container .project-group').forEach(group => {
      const toggle = group.querySelector('.group-toggle');
      group.classList.toggle('collapsed', collapsed);
      if (toggle) toggle.textContent = collapsed ? '▶' : '▼';
    });
  }

  function renderAssignments(issues, nameMap) {
    const container = document.getElementById('assignments-container');
    container.innerHTML = '';

    const groups = [];
    const groupMap = {};
    issues.forEach((issue, idx) => {
      const key = issue.projectKey || 'Unknown';
      if (!groupMap[key]) { groupMap[key] = []; groups.push(key); }
      groupMap[key].push({ issue, idx });
    });

    const STATUS_ORDER = ['Backlog','To Do', 'In Progress', 'In Review', 'Done', 'TIME TRACKING ONLY'];

    groups.forEach(projectKey => {
      const displayName = (nameMap && nameMap[projectKey]) || projectKey;
      const groupItems = groupMap[projectKey];

      const statusCounts = {};
      groupItems.forEach(({ issue }) => {
        statusCounts[issue.status] = (statusCounts[issue.status] || 0) + 1;
      });
      const orderedStatuses = [
        ...STATUS_ORDER.filter(s => statusCounts[s]),
        ...Object.keys(statusCounts).filter(s => !STATUS_ORDER.includes(s)).sort()
      ];
      const summaryText = orderedStatuses.map(s => s + ': ' + statusCounts[s]).join('\n');

      const groupDiv = document.createElement('div');
      groupDiv.className = 'project-group';

      const heading = document.createElement('h3');
      heading.className = 'project-heading';
      heading.onclick = function() { toggleGroup(this); };
      heading.innerHTML = '<span class="group-toggle">▼</span><span class="group-label">' + esc(displayName) + '</span>';

      const body = document.createElement('div');
      body.className = 'project-group-body';

      const summary = document.createElement('p');
      summary.className = 'project-status-summary';
      summary.textContent = summaryText;

      const table = document.createElement('table');
      table.style.tableLayout = 'fixed';
      table.innerHTML = `<thead><tr>
      <th style="width:15%">Key</th>
      <th style="width:30%">Name</th>
      <th style="width:15%">Status</th>
      <th style="width:20%">Time Logged</th>
      <th style="width:20%">Schedule</th>
      </tr></thead>`;
      const tbody = document.createElement('tbody');
      groupItems.forEach(({ issue, idx }) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><a href="${esc(issue.link)}" target="_blank">${esc(issue.key)}</a></td>
          <td>${esc(issue.name)}</td>
          <td>${esc(issue.status)}</td>
          <td>${esc(issue.timeLogged)}</td>
          <td><input type="number" min="0" step="0.25" style="width:80px;" data-idx="${idx}" class="schedule-input" placeholder="0"></td>`;
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);

      body.appendChild(summary);
      body.appendChild(table);
      groupDiv.appendChild(heading);
      groupDiv.appendChild(body);
      container.appendChild(groupDiv);
    });

    container.style.display = '';
    document.getElementById('schedule-toolbar').style.display = '';
    document.getElementById('expand-all-btn').style.display = '';
    document.getElementById('collapse-all-btn').style.display = '';
    setDensity(localStorage.getItem('jtt-density') || 'comfortable');
  }

  function scheduleEvents() {
    const toSchedule = [];
    document.querySelectorAll('.schedule-input').forEach(input => {
      const idx = parseInt(input.dataset.idx);
      const hours = parseFloat(input.value) || 0;
      if (hours > 0 && idx >= 0 && idx < window.loadedIssues.length) {
        const issue = window.loadedIssues[idx];
        toSchedule.push({
          key: issue.key,
          jiraProject: issue.projectKey,
          dropdownValue: issue.dropdownValue,
          hours: hours
        });
      }
    });
    if (toSchedule.length === 0) {
      showStatus('schedule-status', 'Enter hours in the Schedule column first.', 'info');
      return;
    }
    const date = document.getElementById('schedule-date').value;
    const time = document.getElementById('schedule-time').value || '09:00';
    if (!date) { showStatus('schedule-status', 'Choose a start date first.', 'info'); return; }
    const startDateTimeIso = `${date}T${time}:00`;
    setLoading('schedule-btn', true, '⏱ Schedule Calendar Events');
    showStatus('schedule-status', 'Creating calendar events…', 'info');
    google.script.run
      .withSuccessHandler(result => {
        setLoading('schedule-btn', false, '⏱ Schedule Calendar Events');
        showStatus('schedule-status', `Created ${result.created} event(s) starting at ${result.startTime}.`, 'success');
        document.querySelectorAll('.schedule-input').forEach(i => i.value = '');
      })
      .withFailureHandler(e => {
        setLoading('schedule-btn', false, '⏱ Schedule Calendar Events');
        showStatus('schedule-status', 'Error: ' + e.message, 'error');

  }

  function buildPivot(rows, year) {
    const MONTHS = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];

    const projects = [...new Set(rows.map(r => r.projectKey))].sort();
    const data = {};
    rows.forEach(r => {
      if (!data[r.month]) data[r.month] = {};
      data[r.month][r.projectKey] = (data[r.month][r.projectKey] || 0) + r.hours;
    });

    const head = document.getElementById('wl-pivot-head');
    const body = document.getElementById('wl-pivot-body');
    const foot = document.getElementById('wl-pivot-foot');

    head.innerHTML = '<tr><th>Month</th>' +
      projects.map(p => `<th>${esc(p)}</th>`).join('') +
      '<th class="pivot-total">Total</th></tr>';

    const colTotals = new Array(projects.length).fill(0);
    body.innerHTML = MONTHS.map((name, mi) => {
      const key = `${year}-${String(mi + 1).padStart(2, '0')}`;
      const rowData = data[key] || {};
      let rowTotal = 0;
      const cells = projects.map((p, pi) => {
        const v = rowData[p] || 0;
        colTotals[pi] += v;
        rowTotal += v;
        return `<td>${v.toFixed(2)}</td>`;
      });
      return `<tr><td>${name}</td>${cells.join('')}<td class="pivot-total">${rowTotal.toFixed(2)}</td></tr>`;
    }).join('');

    const grandTotal = colTotals.reduce((s, v) => s + v, 0);
    foot.innerHTML = '<tr class="pivot-total"><td>Total</td>' +
      colTotals.map(v => `<td>${v.toFixed(2)}</td>`).join('') +
      `<td class="pivot-total">${grandTotal.toFixed(2)}</td></tr>`;

    document.getElementById('wl-summary').style.display = '';
  }

        document.getElementById('wl-export-btn').style.display = '';

      .withFailureHandler(e => {
        setLoading('wl-load-btn', false, 'Pull Worklog');
        showStatus('wl-status', 'Error: ' + e.message, 'error');
      })
      .getWorklogs(year);
  }

  function exportWorklogCsv() {
    const rows = window.worklogRows || [];
    if (!rows.length) return;
    const headers = ['Month', 'Project', 'Issue', 'Summary', 'Time Spent', 'Hours', 'Started'];
    const csvEsc = v => '"' + String(v || '').replace(/"/g, '""') + '"';
    const lines = [headers.map(csvEsc).join(',')].concat(
      rows.map(r => [r.month, r.projectKey, r.issueKey, r.summary, r.timeSpent, r.hours.toFixed(2), r.started.slice(0, 10)].map(csvEsc).join(','))
    );
    const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'jira-worklog-' + (document.getElementById('wl-year').value || new Date().getFullYear()) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const CHANGELOG_SECTION_ORDER = ['High Impact', 'Medium Impact', 'Low Impact / Polish'];

  function renderChangelogGroup(container, section, items) {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'project-group';

    const heading = document.createElement('h3');
    heading.className = 'project-heading';
    heading.onclick = function() { toggleGroup(this); };
    heading.innerHTML = '<span class="group-toggle">▼</span><span class="group-label">' + esc(section) + ' (' + items.length + ')</span>';

    const body = document.createElement('div');
    body.className = 'project-group-body';

    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'changelog-item';
      row.dataset.id = item.id;

      row.innerHTML =
        '<div class="changelog-item-body">' +
          '<div class="changelog-title-row">' +
            '<span class="changelog-title">#' + item.id + ' — ' + item.title + '</span>' +
            '<span class="changelog-effort">' + item.effort + '</span>' +
          '</div>' +
          '<div class="changelog-files">' + item.files + '</div>' +
          '<div class="changelog-text">' + item.body + '</div>' +
        '</div>';

      body.appendChild(row);
    });

    groupDiv.appendChild(heading);
    groupDiv.appendChild(body);
    container.appendChild(groupDiv);
  }

  function renderChangelogSection(container, sectionTitle, items) {
    if (!items.length) return;

    const heading = document.createElement('h2');
    heading.className = 'section-title changelog-section-heading';
    heading.textContent = sectionTitle;
    container.appendChild(heading);

    CHANGELOG_SECTION_ORDER.forEach(impact => {
      const impactItems = items.filter(it => it.section === impact);
      if (impactItems.length) renderChangelogGroup(container, impact, impactItems);
    });
  }

  function renderChangelog() {
    const container = document.getElementById('changelog-container');
    container.innerHTML = '';

    const pending = CHANGELOG_ITEMS.filter(it => !it.done);
    const completed = CHANGELOG_ITEMS.filter(it => it.done);

    renderChangelogSection(container, 'Future Enhancements', pending);
    renderChangelogSection(container, 'Completed Changelog', completed);

    document.getElementById('changelog-count').textContent =
      pending.length + ' future enhancement(s) · ' + completed.length + ' completed';
  }

  function setAllChangelogGroupsCollapsed(collapsed) {
    document.querySelectorAll('#changelog-container .project-group').forEach(group => {
      const toggle = group.querySelector('.group-toggle');
      group.classList.toggle('collapsed', collapsed);
      if (toggle) toggle.textContent = collapsed ? '▶' : '▼';
    });
  }

  function loadChangelog() {
    renderChangelog();
  }

  document.querySelector('[data-tab="changelog"]').addEventListener('click', loadChangelog);
